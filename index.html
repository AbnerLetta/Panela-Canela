<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panela & Canela Delivery</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Cabeçalho com logo e nome -->
  <header class="topo">
    <img src="assets/imagens/logo.png" alt="Panela & Canela" class="logo">
    <h1>Panela & Canela Delivery</h1>
  </header>

  <!-- Cardápio -->
  <main>
    <section id="produtos"></section>
  </main>

  <!-- Pedido -->
  <section class="pedido">
    <h2>Fazer Pedido</h2>
    <form id="pedidoForm">
      <input type="text" id="nomeCliente" placeholder="Seu nome" required>
      <input type="text" id="enderecoCliente" placeholder="Endereço completo" required>

      <label for="formaPagamento">Forma de pagamento:</label>
      <select id="formaPagamento" required>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
      </select>

      <label for="frete">Entrega:</label>
      <select id="frete" required>
        <option value="Retirada">Retirada na loja</option>
        <option value="Delivery">Delivery</option>
      </select>

      <textarea id="observacoesCliente" placeholder="Observações (ex.: sem cebola, extra doce)"></textarea>

      <button type="submit">Enviar Pedido</button>
    </form>
  </section>

  <!-- Rodapé -->
  <footer class="rodape">
    <p>© 2026 Panela & Canela Delivery</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
