<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panela & Canela Delivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="topo">
    <img src="https://firebasestorage.googleapis.com/v0/b/SEU_BUCKET/o/logo.png?alt=media" 
         alt="Logo Panela & Canela" class="logo">
    <h1>Panela & Canela Delivery</h1>
    <img src="assets/icones/carrinho.png" alt="Carrinho" class="icone-carrinho">
  </header>

  <main>
    <!-- Categoria Churros Gourmet -->
    <section class="categoria" id="churros-gourmet">
      <h2>Churros Gourmet</h2>
      <div class="grid-produtos" id="produtos-gourmet"></div>
    </section>

    <!-- Categoria Churros Tradicionais -->
    <section class="categoria" id="churros-tradicionais">
      <h2>Churros Tradicionais</h2>
      <div class="grid-produtos" id="produtos-tradicionais"></div>
    </section>

    <!-- Categoria Bebidas -->
    <section class="categoria" id="bebidas">
      <h2>Bebidas</h2>
      <div class="grid-produtos" id="produtos-bebidas"></div>
    </section>

    <!-- Formulário de Pedido -->
    <section class="pedido">
      <h2>Fazer Pedido</h2>
      <form id="pedidoForm">
        <input type="text" id="nomeCliente" placeholder="Seu nome" required>
        <input type="text" id="enderecoCliente" placeholder="Endereço completo" required>
        <select id="formaPagamento" required>
          <option value="">Forma de pagamento</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
          <option value="Pix">Pix</option>
        </select>
        <select id="frete" required>
          <option value="">Entrega</option>
          <option value="Retirada">Retirada</option>
          <option value="Delivery">Delivery</option>
        </select>
        <textarea id="observacoesCliente" placeholder="Observações"></textarea>
        <button type="submit">Enviar Pedido</button>
      </form>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="rodape">
    <p>&copy; 2026 Panela & Canela Delivery</p>
    <img src="assets/icones/entrega.png" alt="Entrega" class="icone-entrega">
    <img src="assets/icones/pagamento.png" alt="Pagamento" class="icone-pagamento">
    <img src="assets/icones/promocao.png" alt="Promoção" class="icone-promocao">
    <img src="assets/icones/usuario.png" alt="Usuário" class="icone-usuario">
  </footer>

  <script src="script.js" type="module"></script>
</body>
</html>
